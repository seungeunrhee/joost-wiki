<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>유스트 인수인계 위키</title>
<meta name="description" content="업무 인수인계 문서를 대충 검색해도 찾을 수 있는 팀 위키">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#EEF1F4; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --ink:#15181D; --ink-2:#4E5A66; --ink-3:#7B8794;
  --line:#DCE2E8; --line-2:#C8D1DA;
  --onair:#C0392B; --onair-soft:#FBEAE7;
  --sea:#1F6B86; --sea-soft:#E4F0F4;
  --good:#276B4E; --good-soft:#E3F1EA;
  --warn:#9A6410; --warn-soft:#FBF0DC;
  --plum:#6A4C93; --plum-soft:#EFEAF6;
  --slate:#44566B; --slate-soft:#E8EDF2;
  --focus:#1F6B86;
  --shadow:0 1px 2px rgba(21,24,29,.05), 0 6px 20px -12px rgba(21,24,29,.25);
  --radius:10px;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --display:"Gothic A1","IBM Plex Sans KR","Apple SD Gothic Neo",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1317; --surface:#171C21; --surface-2:#1D232A;
    --ink:#E6EBF0; --ink-2:#A3AFBB; --ink-3:#7A8794;
    --line:#272F37; --line-2:#333D47;
    --onair:#F0705F; --onair-soft:#2E1A18;
    --sea:#6FBCD6; --sea-soft:#14252C;
    --good:#67C39A; --good-soft:#12241C;
    --warn:#D9A44E; --warn-soft:#2A2113;
    --plum:#B08BD8; --plum-soft:#231C2E;
    --slate:#9AAABB; --slate-soft:#1B2229;
    --focus:#6FBCD6;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -14px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1317; --surface:#171C21; --surface-2:#1D232A;
  --ink:#E6EBF0; --ink-2:#A3AFBB; --ink-3:#7A8794;
  --line:#272F37; --line-2:#333D47;
  --onair:#F0705F; --onair-soft:#2E1A18;
  --sea:#6FBCD6; --sea-soft:#14252C;
  --good:#67C39A; --good-soft:#12241C;
  --warn:#D9A44E; --warn-soft:#2A2113;
  --plum:#B08BD8; --plum-soft:#231C2E;
  --slate:#9AAABB; --slate-soft:#1B2229;
  --focus:#6FBCD6;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -14px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.wrap{max-width:1140px;margin:0 auto;padding-inline:16px;padding-block:0 72px}

.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb, var(--paper) 90%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1140px;margin:0 auto;padding:14px 16px 12px;display:flex;flex-direction:column;gap:12px}
.brandrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mark{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--onair);box-shadow:0 0 0 3px var(--onair-soft)}
.brandsub{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.spacer{flex:1}
.searchbox{position:relative;display:flex;align-items:center}
.searchbox>svg{position:absolute;left:14px;width:17px;height:17px;color:var(--ink-3);pointer-events:none}
#q{width:100%;padding:13px 44px 13px 40px;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--radius);font-size:16px;box-shadow:var(--shadow)}
#q::placeholder{color:var(--ink-3)}
.clearq{position:absolute;right:8px;border:0;background:transparent;color:var(--ink-3);cursor:pointer;padding:6px;border-radius:6px;line-height:1}
.clearq:hover{background:var(--surface-2);color:var(--ink)}
.hintrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink-3)}
.hint{font-family:var(--mono);font-size:11px;background:var(--surface);border:1px solid var(--line);padding:2px 7px;border-radius:999px;cursor:pointer;color:var(--ink-2)}
.hint:hover{border-color:var(--sea);color:var(--sea)}
.nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;flex:none}
.nav button{border:0;background:transparent;color:var(--ink-2);padding:5px 14px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:500}
.nav button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.whoami{font-size:12px;color:var(--ink-3);background:transparent;border:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

.cats{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 14px}
.cat{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px}
.cat:hover{border-color:var(--line-2);color:var(--ink)}
.cat[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.cat .n{font-family:var(--mono);font-size:11px;opacity:.6}

.cols{display:grid;grid-template-columns:1fr 268px;gap:26px;align-items:start}
@media (max-width:840px){.cols{grid-template-columns:1fr}.side{order:-1}}
.sectlabel{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.sectlabel::after{content:"";flex:1;height:1px;background:var(--line)}

.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;cursor:pointer;text-align:left;width:100%;display:block;transition:border-color .14s ease, transform .14s ease}
.card:hover{border-color:var(--line-2);transform:translateY(-1px)}
.card h3{margin:0 0 4px;font-family:var(--display);font-weight:700;font-size:16.5px;letter-spacing:-.01em;text-wrap:balance}
.card p{margin:0;color:var(--ink-2);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cardmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:7px}
.pill{font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;padding:2px 7px;border-radius:4px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.pill.sop{background:var(--sea-soft);color:var(--sea);border-color:transparent}
.pill.channel{background:var(--onair-soft);color:var(--onair);border-color:transparent}
.pill.faq{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.schedule{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.why{background:transparent;border-style:dashed;color:var(--ink-3)}
.pill.sample{background:transparent;border-color:var(--line-2);color:var(--ink-3)}
.pill.prog{background:var(--good-soft);color:var(--good);border-color:transparent}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.tag{font-size:11.5px;color:var(--ink-3)}
.tag::before{content:"#";opacity:.5}
.empty{border:1px dashed var(--line-2);border-radius:var(--radius);padding:28px 20px;text-align:center;color:var(--ink-2);background:var(--surface-2)}
.empty strong{display:block;font-family:var(--display);font-weight:700;color:var(--ink);margin-bottom:6px;font-size:15px}

.side{display:flex;flex-direction:column;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.panel h4{margin:0 0 10px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.mini{display:flex;flex-direction:column;gap:2px}
.mini button{background:transparent;border:0;text-align:left;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--ink-2);display:flex;gap:8px;align-items:baseline;width:100%}
.mini button:hover{background:var(--surface-2);color:var(--ink)}
.mini .kk{font-family:var(--mono);font-size:10px;color:var(--ink-3);flex:none;width:34px}
.mini .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary:hover{opacity:.88}
.btn.danger{color:var(--onair);border-color:var(--onair)}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}

.doc{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}
@media (max-width:520px){.doc{padding:18px 16px}}
.doc h1{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.025em;margin:8px 0 8px;text-wrap:balance;line-height:1.3}
.doc .lede{color:var(--ink-2);margin:0 0 18px;font-size:15px}
.docmeta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-family:var(--mono);font-size:11px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:12px;margin-top:22px}
.block{margin-top:22px}
.block h2{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.01em;margin:0 0 10px;color:var(--ink);display:flex;align-items:center;gap:8px}
.block h2::before{content:"";width:3px;height:14px;background:var(--sea);border-radius:2px;flex:none}
.block.warn h2::before{background:var(--onair)}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;padding:10px 0 10px 40px;position:relative;border-bottom:1px solid var(--line)}
ol.steps li:last-child{border-bottom:0}
ol.steps li::before{content:counter(s,decimal-leading-zero);position:absolute;left:0;top:11px;font-family:var(--mono);font-size:11px;color:var(--sea);font-weight:500}
ul.bul{margin:0;padding-left:18px}
ul.bul li{margin:5px 0}
.warnbox{background:var(--onair-soft);border-radius:8px;padding:12px 14px 12px 16px}
.warnbox ul{margin:0;padding-left:16px}
.warnbox li{margin:4px 0;color:var(--ink)}
.fields{display:grid;grid-template-columns:auto 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.fields dt{padding:9px 14px;background:var(--surface-2);font-size:13px;color:var(--ink-2);border-bottom:1px solid var(--line);white-space:nowrap}
.fields dd{padding:9px 14px;margin:0;border-bottom:1px solid var(--line);font-size:14px;overflow-wrap:anywhere}
.fields dt:nth-last-of-type(1),.fields dd:nth-last-of-type(1){border-bottom:0}
.ptext{margin:0;white-space:pre-wrap;color:var(--ink-2)}
.backrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}

.chklist{margin:0;padding:0;list-style:none;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.chklist li{border-bottom:1px solid var(--line)}
.chklist li:last-child{border-bottom:0}
.chkrow{display:flex;gap:11px;align-items:flex-start;padding:10px 13px;width:100%;background:transparent;border:0;text-align:left;cursor:pointer;font-size:14.5px;line-height:1.6}
.chkrow:hover{background:var(--surface-2)}
.chkbox{flex:none;width:18px;height:18px;border:1.5px solid var(--line-2);border-radius:5px;margin-top:3px;display:grid;place-items:center;font-size:11px;color:transparent}
.chkrow[aria-pressed="true"] .chkbox{background:var(--good);border-color:var(--good);color:#fff}
.chkrow[aria-pressed="true"] .chktext{color:var(--ink-3);text-decoration:line-through}
.chkhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:9px}
.progbar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;flex:1;min-width:90px}
.progbar i{display:block;height:100%;background:var(--good);border-radius:3px}

.filegrid{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.fileitem{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-2);max-width:220px}
.fileitem img{display:block;width:100%;height:auto;max-height:240px;object-fit:cover}
.filecap{padding:6px 9px;font-size:11.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px;justify-content:space-between}
.filecap a{color:var(--sea)}

.composer{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
@media (max-width:520px){.composer{padding:16px}}
.composer h2{font-family:var(--display);font-weight:800;font-size:20px;margin:0 0 4px;letter-spacing:-.02em}
.composer .sub{color:var(--ink-2);font-size:13.5px;margin:0 0 16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.thinking{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.editfield{display:flex;flex-direction:column;gap:5px;margin-top:14px}
.editfield label{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.editfield input,.editfield select,.editfield textarea{padding:9px 11px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface);font-size:14px;width:100%}
.editfield textarea{resize:vertical;line-height:1.7}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.bedit{border:1px solid var(--line);border-radius:9px;padding:12px;margin-top:10px;background:var(--surface-2)}
.brow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.brow select{padding:5px 8px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);font-size:12.5px;flex:none}
.brow input{flex:1;min-width:120px;padding:5px 9px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);font-size:13.5px}
.iconbtn{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:12px;line-height:1;display:grid;place-items:center;color:var(--ink-2);flex:none}
.iconbtn:hover{border-color:var(--ink-3);color:var(--ink)}
.bedit textarea{width:100%;min-height:76px;resize:vertical;padding:9px 11px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface);font-size:13.5px;line-height:1.75}
.bhelp{font-size:11.5px;color:var(--ink-3);margin:6px 0 0}
.notice{border-radius:8px;padding:10px 12px;font-size:13px;margin-top:12px;background:var(--warn-soft);color:var(--warn)}
.notice.err{background:var(--onair-soft);color:var(--onair)}
.notice.ok{background:var(--good-soft);color:var(--good)}
.skel{height:70px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);opacity:.6;margin-bottom:10px}
.drop{border:1.5px dashed var(--line-2);border-radius:9px;padding:20px;text-align:center;color:var(--ink-2);background:var(--surface-2);cursor:pointer;font-size:14px}
.drop:hover,.drop.over{border-color:var(--sea);color:var(--sea)}
.pickrow{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.pickrow:last-child{border-bottom:0}
.pickrow input{margin-top:5px;flex:none;width:17px;height:17px;accent-color:var(--sea)}
.pickrow b{display:block;font-weight:600;font-size:14.5px}
.pickrow span{font-size:13px;color:var(--ink-2)}
code{font-family:var(--mono);font-size:.92em}

.calbar{display:flex;align-items:center;gap:8px;margin:18px 0 12px;flex-wrap:wrap}
.calmonth{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em;margin:0}
.calgrid{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.dow{display:grid;grid-template-columns:repeat(7,1fr);background:var(--surface-2);border-bottom:1px solid var(--line)}
.dow span{padding:7px 4px;text-align:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink-3)}
.dow span:first-child{color:var(--onair)}
.dow span:last-child{color:var(--sea)}
.days{display:grid;grid-template-columns:repeat(7,1fr)}
.day{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:96px;padding:5px 5px 6px;background:transparent;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.day:nth-child(7n){border-right:0}
.day:hover{background:var(--surface-2)}
.day[aria-pressed="true"]{background:var(--sea-soft)}
.day.out{opacity:.38}
.dnum{font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
.day.today .dnum{color:var(--paper);background:var(--ink);border-radius:999px;padding:1px 6px;align-self:flex-start}
.evchip{font-size:11px;line-height:1.45;padding:2px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.more{font-size:10.5px;color:var(--ink-3);padding-left:3px}
@media (max-width:560px){.day{min-height:68px;padding:4px 3px}.evchip{font-size:10px;padding:1px 4px}}
.pf-amber{background:var(--warn-soft);color:var(--warn)}
.pf-plum{background:var(--plum-soft);color:var(--plum)}
.pf-red{background:var(--onair-soft);color:var(--onair)}
.pf-blue{background:var(--sea-soft);color:var(--sea)}
.pf-green{background:var(--good-soft);color:var(--good)}
.pf-slate{background:var(--slate-soft);color:var(--slate)}
.pfdot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--ink-3);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dayp{margin-top:18px}
.evrow{display:flex;gap:10px;align-items:center;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:11px 13px;cursor:pointer;text-align:left;margin-bottom:8px}
.evrow:hover{border-color:var(--line-2)}
.evrow .tm{font-family:var(--mono);font-size:12px;color:var(--ink-3);flex:none;width:44px}
.evrow .ti{font-weight:600;font-size:14.5px}
.evrow .rt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-3);flex:none}
.srcdoc{border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-top:12px}
.srchead{display:flex;align-items:center;gap:8px;padding:9px 13px;background:var(--surface-2);border-bottom:1px solid var(--line);font-size:13px}
.srchead b{font-weight:600}
.srchead button{margin-left:auto}
.srcdoc .chklist{border:0;border-radius:0}
.suggest{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.suggest button{border:1px dashed var(--line-2);background:transparent;border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.suggest button:hover{border-color:var(--sea);color:var(--sea)}
.setup{max-width:640px;margin:60px auto;padding:28px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.setup h1{font-family:var(--display);font-weight:800;font-size:22px;margin:0 0 10px}
.setup pre{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;font-family:var(--mono);font-size:12.5px}
</style>
</head>
<body>

/* ══════════════ 1. 한글 검색 엔진 ══════════════ */
const CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const JUNG=['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const JONG=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function norm(s){return String(s==null?'':s).toLowerCase().replace(/[\s\-_/().,·:;'"’“”\[\]]/g,'');}
function isSyl(c){return c>=0xAC00&&c<=0xD7A3;}
function toJamo(s){let o='';for(const ch of norm(s)){const c=ch.charCodeAt(0);if(isSyl(c)){const i=c-0xAC00;o+=CHO[(i/588)|0]+JUNG[((i%588)/28)|0]+JONG[i%28];}else o+=ch;}return o;}
function toCho(s){let o='';for(const ch of norm(s)){const c=ch.charCodeAt(0);if(isSyl(c))o+=CHO[((c-0xAC00)/588)|0];else o+=ch;}return o;}
const EK={q:'ㅂ',w:'ㅈ',e:'ㄷ',r:'ㄱ',t:'ㅅ',y:'ㅛ',u:'ㅕ',i:'ㅑ',o:'ㅐ',p:'ㅔ',a:'ㅁ',s:'ㄴ',d:'ㅇ',f:'ㄹ',g:'ㅎ',h:'ㅗ',j:'ㅓ',k:'ㅏ',l:'ㅣ',z:'ㅋ',x:'ㅌ',c:'ㅊ',v:'ㅍ',b:'ㅠ',n:'ㅜ',m:'ㅡ'};
function engToJamo(s){const n=norm(s);let o='',h=0;for(const ch of n){if(EK[ch]){o+=EK[ch];h++;}else if(/[a-z0-9]/.test(ch)){o+=ch;}else return null;}return h>=2?o:null;}
function bigrams(s){const a=[];for(let i=0;i<s.length-1;i++)a.push(s.slice(i,i+2));return a;}
function dice(a,b){if(!a||!b)return 0;if(a===b)return 1;const A=bigrams(a),B=bigrams(b);if(!A.length||!B.length)return 0;const m=new Map();for(const g of A)m.set(g,(m.get(g)||0)+1);let hit=0;for(const g of B){const c=m.get(g)||0;if(c>0){hit++;m.set(g,c-1);}}return 2*hit/(A.length+B.length);}

const SYN=[
  ['카쇼라','카카오쇼핑라이브','카카오','카카오톡쇼핑라이브','kakao','카쇼'],
  ['더현대','현대','더현대닷컴','hyundai','현대백화점'],
  ['cj온스타일','cj','씨제이','온스타일','cjonstyle'],
  ['롯데아이몰','롯데','아이몰','lotte','imall','롯데온'],
  ['네이버','스마트스토어','네이버쇼핑라이브','naver','스토어'],
  ['쿠팡','coupang','로켓배송','로켓'],
  ['고도몰','자사몰','공식몰','godo','자사'],
  ['방송','라이브','라방','생방송','live','온에어'],
  ['상품코드','품번','sku','코드','상품번호'],
  ['정산','수수료','세금계산서','매출정산','정산마감'],
  ['재고','물류','출고','발주','입고'],
  ['반품','교환','클레임','cs','고객문의'],
  ['쿠폰','할인','프로모션','행사','기획전'],
  ['썸네일','배너','이미지','디자인','소재'],
  ['큐시트','대본','진행표','스크립트']
];
const SYNMAP=(()=>{const m=new Map();for(const g of SYN)for(const w of g){const k=norm(w);const cur=m.get(k)||new Set();g.forEach(x=>cur.add(x));m.set(k,cur);}return m;})();
function synonymsOf(tok){
  const k=norm(tok),out=new Set();
  if(SYNMAP.has(k))SYNMAP.get(k).forEach(x=>out.add(x));
  else if(k.length>=3)for(const [key,set] of SYNMAP){if(key.startsWith(k)||k.startsWith(key))set.forEach(x=>out.add(x));}
  out.delete(tok);return [...out].slice(0,12);
}
function docText(d){
  const out=[d.title||'',d.summary||'',(d.tags||[]).join(' '),(d.keywords||[]).join(' ')];
  for(const b of (d.blocks||[])){
    out.push(b.heading||'');
    if(b.items)out.push(b.items.join(' '));
    if(b.text)out.push(b.text);
    if(b.pairs)out.push(b.pairs.map(p=>p.k+' '+p.v).join(' '));
  }
  return out.join(' ');
}
function tri(s){return {n:norm(s),j:toJamo(s),c:toCho(s)};}
function indexOf(d){
  if(d._ix&&d._ix._v===d.updatedAt)return d._ix;
  const terms=[],seen=new Set();
  for(const w of (d.keywords||[]).concat(d.tags||[])){const t=tri(w);if(t.n&&!seen.has(t.n)){seen.add(t.n);terms.push(t);}}
  const ix={_v:d.updatedAt,t:tri(d.title||''),terms,b:tri(docText(d))};
  Object.defineProperty(d,'_ix',{value:ix,writable:true,enumerable:false,configurable:true});
  return ix;
}
function match(v,x,whole,nocho){
  if(!v.n||!x.n)return [0,''];
  if(whole&&v.n===x.n)return [100,'정확히 일치'];
  if(v.n.length>=1&&x.n.includes(v.n))return [whole?90:100,'일치'];
  if(v.j.length>=2&&x.j.includes(v.j))return [whole?86:92,'일치'];
  if(nocho)return [0,''];
  if(v.c.length>=2&&whole&&v.c===x.c)return [76,'초성 일치'];
  if(v.c.length>=2&&x.c.includes(v.c))return [whole?62:66,'초성 일치'];
  if(v.j.length>=3){const sim=dice(v.j,x.j);if(sim>=0.55)return [Math.round(34+52*sim),'오타 보정'];}
  return [0,''];
}
function buildQuery(raw){
  const q=String(raw||'').trim();if(!q)return null;
  const tokens=q.split(/\s+/).filter(Boolean),vs=[],seen=new Set();
  const add=(text,label,pre)=>{
    const t=pre?{n:text,j:text,c:text}:tri(text);
    if(!t.n||seen.has(t.n+'|'+label))return;seen.add(t.n+'|'+label);
    vs.push({...t,label,w:label?0.72:1});
  };
  add(q,null);
  if(tokens.length>1)for(const t of tokens)add(t,null);
  const ek=engToJamo(q);if(ek)add(ek,'영문 자판',true);
  for(const t of tokens)for(const s of synonymsOf(t))add(s,'유사어 '+s);
  return {raw:q,tokens,vs};
}
function scoreDoc(d,Q){
  const ix=indexOf(d);let best=0,why='';
  for(const v of Q.vs){
    let s=0,r='';
    const [ts,tr]=match(v,ix.t,false);
    if(ts>s){s=ts;r=tr==='일치'?'제목 일치':tr;}
    for(const term of ix.terms){
      const [ks,kr]=match(v,term,true);const adj=Math.round(ks*0.95);
      if(adj>s){s=adj;r=(kr==='정확히 일치'||kr==='일치')?'검색어 등록됨':kr;}
    }
    if(s<58){const [bs]=match(v,ix.b,false,true);const cap=Math.min(bs,60);if(cap>s){s=cap;r='본문 일치';}}
    if(s>0){s*=v.w;if(s>best){best=s;why=v.label?v.label:r;}}
  }
  if(Q.tokens.length>1){
    let all=true;
    for(const t of Q.tokens){const n=norm(t);if(n&&!ix.b.n.includes(n)&&!ix.b.j.includes(toJamo(t)))all=false;}
    if(all)best+=14;
  }
  if(d.sample)best-=6;
  return {score:best,why};
}
/* AI 없이 검색어 자동 생성: 본문 용어 추출 + 사전 확장 */
function autoKeywords(d){
  const out=new Set(d.keywords||[]);
  const text=(d.title+' '+d.summary+' '+docText(d)).toLowerCase();
  for(const g of SYN){
    for(const w of g){ if(text.includes(w.toLowerCase())){ g.forEach(x=>out.add(x)); break; } }
  }
  const words=(d.title+' '+d.summary).split(/[\s,./()·\-]+/).map(w=>w.trim()).filter(w=>w.length>=2&&w.length<=12);
  words.forEach(w=>out.add(w));
  return [...out].filter(Boolean).slice(0,40);
}

function pad(n){return String(n).padStart(2,'0');}
function fmtDate(iso){if(!iso)return '';const d=new Date(iso);if(isNaN(d))return '';return d.getFullYear()+'.'+pad(d.getMonth()+1)+'.'+pad(d.getDate());}

function periodKey(cycle){
  const d=new Date(),y=d.getFullYear(),m=d.getMonth();
  if(cycle==='none')return 'ALL';
  if(cycle==='day')return y+'-'+pad(m+1)+'-'+pad(d.getDate());
  if(cycle==='week'){const t=new Date(y,m,d.getDate()-((d.getDay()+6)%7));return 'W'+t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());}
  if(cycle==='quarter')return y+'Q'+(Math.floor(m/3)+1);
  return y+'-'+pad(m+1);
}
function periodLabel(cycle){
  const d=new Date();
  if(cycle==='none')return '전체';
  if(cycle==='day')return (d.getMonth()+1)+'월 '+d.getDate()+'일';
  if(cycle==='week')return '이번 주';
  if(cycle==='quarter')return (Math.floor(d.getMonth()/3)+1)+'분기';
  return (d.getMonth()+1)+'월';
}
function isChecklist(d){return d&&d.type==='schedule';}
function checkState(d){
  const st=S.checks[d.id],p=periodKey(d.cycle||'month');
  if(!st||st.period!==p)return {period:p,items:{}};
  return {period:p,items:st.items||{}};
}
function checkStats(d){
  if(!isChecklist(d))return null;
  const st=checkState(d);let total=0,done=0;
  (d.blocks||[]).forEach((b,bi)=>{
    if(b.kind!=='steps'&&b.kind!=='list')return;
    (b.items||[]).forEach((_,ii)=>{total++;if(st.items[bi+'_'+ii])done++;});
  });
  return total?{total,done,st}:null;
}

async function loadAll(){
  try{
    const [d,e,c]=await Promise.all([
      sb.from('docs').select('*').order('updated_at',{ascending:false}).limit(1000),
      sb.from('events').select('*').order('date',{ascending:false}).limit(1000),
      sb.from('checks').select('*').limit(2000)
    ]);
    if(d.error)throw d.error;
    S.docs=(d.data||[]).map(docFrom);
    S.events=(e.data||[]).map(evFrom);
    const m={};(c.data||[]).forEach(r=>{m[r.id]={period:r.period,items:r.items||{}};});
    S.checks=m;
    S.loaded=true;
    if(S.cur){const f=S.docs.find(x=>x.id===S.cur.id);if(f)S.cur=f;}
    if(S.curEv){const f=S.events.find(x=>x.id===S.curEv.id);if(f)S.curEv=f;}
  }catch(err){
    S.loaded=true;
    S.msg={t:'데이터를 불러오지 못했습니다. Supabase 설정(URL·키·테이블)을 확인해 주세요. '+(err.message||''),k:'err'};
  }
  render();
}

  document.getElementById('clearq').hidden=!S.q;
  document.getElementById('whoami').textContent=S.me?S.me:'이름 설정';
  document.getElementById('navDocs').setAttribute('aria-pressed',String(!inCal));
  document.getElementById('navCal').setAttribute('aria-pressed',String(inCal));
  if(S.view==='doc'&&S.cur)return renderDoc();
  if(S.view==='compose')return renderCompose();
  if(S.view==='io')return renderIO();
  if(S.view==='cal')return renderCal();
  if(S.view==='event')return renderEvent();
  if(S.view==='evedit')return renderEvEdit();
  renderList();
}
function catBar(){
  const c={all:S.docs.length};
  for(const k in TYPES)c[k]=S.docs.filter(d=>d.type===k).length;
  const mk=(k,l)=>`<button class="cat" data-cat="${k}" aria-pressed="${S.cat===k}">${esc(l)}<span class="n">${c[k]||0}</span></button>`;
  return `<div class="cats">${mk('all','전체')}${Object.keys(TYPES).map(k=>mk(k,TYPES[k].ko)).join('')}</div>`;
}
function renderList(){
  const Q=buildQuery(S.q);
  let rows;
  if(Q)rows=S.docs.map(d=>({d,...scoreDoc(d,Q)})).filter(r=>r.score>18).sort((a,b)=>b.score-a.score);

  if(S.cat!=='all')rows=rows.filter(r=>r.d.type===S.cat);
  const recent=S.docs.slice().sort((a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||''))).slice(0,7);
  app.innerHTML=`
    ${S.msg?`<div class="notice ${esc(S.msg.k||'')}">${esc(S.msg.t)}</div>`:''}
    ${catBar()}
    <div class="cols">
      <div>

        <div class="list">
          ${!S.loaded?'<div class="skel"></div><div class="skel"></div><div class="skel"></div>':''}

        </div>
      </div>

async function toggleCheck(d,key){

/* ── 편집기 ── */
function blankDoc(){return {id:uid(),title:'',type:'sop',summary:'',tags:[],keywords:[],blocks:[{kind:'steps',heading:'진행 순서',items:['']}],raw:'',files:[],cycle:'month',author:S.me};}
function startCompose(doc){
  S.editing=doc||null;
  S.draft=doc?JSON.parse(JSON.stringify(doc)):blankDoc();
  if(!S.draft.files)S.draft.files=[];
  if(!S.draft.cycle)S.draft.cycle='month';
  S.view='compose';S.msg=null;window.scrollTo(0,0);render();
}
function blockToText(b){
  if(b.kind==='text')return b.text||'';
  if(b.kind==='fields')return (b.pairs||[]).map(p=>p.k+': '+p.v).join('\n');
  return (b.items||[]).join('\n');
}
function textToBlock(kind,heading,text){
  const o={kind,heading:heading.trim()};
  if(kind==='text')o.text=text;
  else if(kind==='fields')o.pairs=text.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    const i=l.search(/[:|]/);return i<0?{k:l,v:''}:{k:l.slice(0,i).trim(),v:l.slice(i+1).trim()};});
  else o.items=text.split('\n').map(l=>l.trim()).filter(Boolean);
  return o;
}
function readEditor(){
  const d=S.draft||blankDoc();
  const g=id=>{const e=document.getElementById(id);return e?e.value:'';};
  d.title=g('f_title');d.type=g('f_type')||d.type;d.summary=g('f_sum');d.cycle=g('f_cycle')||d.cycle;
  d.keywords=g('f_kw').split(',').map(x=>x.trim()).filter(Boolean);
  d.tags=g('f_tags').split(',').map(x=>x.trim()).filter(Boolean);
  const bs=[];
  app.querySelectorAll('.bedit').forEach(el=>{
    const b=textToBlock(el.querySelector('.bkind').value,el.querySelector('.bhead').value,el.querySelector('.bbody').value);
    if((b.items&&b.items.length)||(b.pairs&&b.pairs.length)||b.text||b.heading)bs.push(b);
  });
  d.blocks=bs;S.draft=d;return d;
}

}

  const help={steps:'한 줄에 한 단계씩',list:'한 줄에 하나씩',warn:'한 줄에 하나씩',fields:'한 줄에 “항목: 값”',text:'자유롭게'};

function refreshEditor(){document.getElementById('editor').innerHTML=editorHTML(S.draft);wireEditor();}
function setMsg(t,k){S.msg={t,k};const m=document.getElementById('msg');if(m)m.innerHTML=`<div class="notice ${esc(k||'')}">${esc(t)}</div>`;}
function wireEditor(){
  document.getElementById('save').onclick=saveDoc;
  document.getElementById('genKw').onclick=()=>{
    readEditor();S.draft.keywords=autoKeywords(S.draft);refreshEditor();
    setMsg('검색어 '+S.draft.keywords.length+'개가 되었습니다. 필요 없는 건 지우세요.','ok');
  };
  app.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{
    readEditor();const k=b.dataset.add;
    S.draft.blocks.push(k==='text'?{kind:'text',heading:'',text:''}:k==='fields'?{kind:'fields',heading:'',pairs:[]}:{kind:k,heading:'',items:[]});
    refreshEditor();
  });
  app.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{readEditor();S.draft.blocks.splice(+b.dataset.rm,1);refreshEditor();});
  app.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{
    readEditor();const [i,dir]=b.dataset.mv.split(':').map(Number),j=i+dir;
    if(j<0||j>=S.draft.blocks.length)return;
    const a=S.draft.blocks;[a[i],a[j]]=[a[j],a[i]];refreshEditor();
  });
  app.querySelectorAll('.bkind').forEach(sel=>sel.onchange=()=>{readEditor();refreshEditor();});
  app.querySelectorAll('[data-rmfile]').forEach(b=>b.onclick=()=>{readEditor();S.draft.files.splice(+b.dataset.rmfile,1);refreshEditor();});
  const drop=document.getElementById('drop'),fin=document.getElementById('fileIn');
  drop.onclick=()=>fin.click();
  fin.onchange=()=>uploadFiles([...fin.files]);
  drop.ondragover=e=>{e.preventDefault();drop.classList.add('over');};
  drop.ondragleave=()=>drop.classList.remove('over');
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');uploadFiles([...(e.dataTransfer.files||[])]);};
  const tin=document.getElementById('txtIn');
  document.getElementById('readFile').onclick=()=>tin.click();
  tin.onchange=async()=>{
    const f=tin.files[0];if(!f)return;
    setMsg('파일을 읽는 중…');
    try{
      const text=await extractText(f);
      readEditor();
      S.draft.blocks.push({kind:'text',heading:f.name,text:text.slice(0,20000)});
      refreshEditor();setMsg('불러왔습니다. 필요한 부분만 남기고 절차·목록 블록으로 옮겨 정리하세요.','ok');
    }catch(e){setMsg('이 형식은 읽지 못했습니다. 내용을 복사해서 붙여넣어 주세요.','err');}
  };
}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load'));document.head.appendChild(s);});}
async function extractText(file){
  const ext=file.name.toLowerCase().split('.').pop();
  if(['txt','md','csv','tsv','json'].includes(ext))return await file.text();
  if(ext==='xlsx'||ext==='xls'){
    if(!window.XLSX)await loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
    const wb=window.XLSX.read(await file.arrayBuffer(),{type:'array'});
    return wb.SheetNames.map(n=>'### 시트: '+n+'\n'+window.XLSX.utils.sheet_to_csv(wb.Sheets[n])).join('\n\n');
  }
  if(ext==='docx'){
    if(!window.mammoth)await loadScript('https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js');
    return (await window.mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()})).value||'';
  }
  throw new Error('unsupported');
}
async function uploadFiles(files){
  if(!files.length)return;
  readEditor();
  const drop=document.getElementById('drop');
  for(const f of files){
    if(f.size>25*1024*1024){setMsg('25MB를 넘는 파일은 올릴 수 없습니다: '+f.name,'err');continue;}
    if(drop)drop.textContent='올리는 중… '+f.name;
    const path=Date.now()+'_'+Math.random().toString(36).slice(2)+'_'+f.name.replace(/[^\w.\-가-힣]/g,'_');
    const {error}=await sb.storage.from(BUCKET).upload(path,f,{cacheControl:'3600',upsert:false});
    if(error){setMsg('업로드 실패: '+f.name+' — Storage 버킷("'+BUCKET+'")이 있는지 확인해 주세요.','err');continue;}
    const {data}=sb.storage.from(BUCKET).getPublicUrl(path);
    S.draft.files.push({path,url:data.publicUrl,name:f.name,type:f.type||''});
  }
  if(drop)drop.textContent='이미지·PDF·양식 파일을 끌어다 놓거나 눌러서 선택';
  refreshEditor();
}
async function saveDoc(){
  const d=readEditor();
  if(!d.title.trim()){setMsg('제목을 적어주세요.','err');return;}
  d.author=S.me||d.author||'';
  const msg=document.getElementById('savemsg');if(msg)msg.textContent='저장 중…';
  const {error}=await sb.from('docs').upsert(docRow(d));
  if(error){if(msg)msg.textContent='';setMsg('저장하지 못했습니다: '+error.message,'err');return;}
  S.editing=null;S.draft=null;S.msg=null;S.view='list';S.cur=null;S.cat='all';
  await loadAll();
}

      <div class="row"><button class="btn primary" id="doImport">문서로 추가</button>
        <button class="btn" id="doExport">전체 내보내기 (백업)</button>
        <span class="thinking" id="iomsg">${esc(S.io.res)}</span></div>
      <div id="msg">${S.msg?`<div class="notice ${esc(S.msg.k||'')}">${esc(S.msg.t)}</div>`:''}</div>
    </div>`;
  document.getElementById('cancel').onclick=()=>{S.view='list';S.msg=null;render();};
  document.getElementById('doImport').onclick=doImport;
  document.getElementById('doExport').onclick=doExport;
}
async function doImport(){
  const raw=document.getElementById('io_text').value.trim();
  if(!raw){setMsg('JSON을 붙여넣어 주세요.','err');return;}
  let data;
  try{data=JSON.parse(raw);}catch(e){setMsg('JSON 형식이 올바르지 않습니다.','err');return;}
  const list=Array.isArray(data)?data:[data];
  const rows=[];
  for(const x of list){
    if(!x||!x.title)continue;
    const d={
      id:x.id||uid(),title:String(x.title),
      type:Object.keys(TYPES).includes(x.type)?x.type:'sop',
      summary:String(x.summary||''),
      tags:Array.isArray(x.tags)?x.tags.map(String):[],
      keywords:Array.isArray(x.keywords)?x.keywords.map(String):[],
      blocks:Array.isArray(x.blocks)?x.blocks:[],
      files:Array.isArray(x.files)?x.files:[],
      cycle:Object.keys(CYCLES).includes(x.cycle)?x.cycle:'month',
      raw:String(x.raw||''),author:String(x.author||S.me||''),sample:false
    };
    if(!d.keywords.length)d.keywords=autoKeywords(d);
    rows.push(docRow(d));
  }
  if(!rows.length){setMsg('문서로 만들 수 있는 항목이 없습니다. title 이 있어야 합니다.','err');return;}
  const {error}=await sb.from('docs').upsert(rows);
  if(error){setMsg('저장 실패: '+error.message,'err');return;}
  S.io={text:'',res:''};S.msg=null;S.view='list';S.cat='all';
  await loadAll();
}
function doExport(){
  const data=JSON.stringify({docs:S.docs,events:S.events},null,2);
  const blob=new Blob([data],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='인수인계위키_백업_'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();
  document.getElementById('iomsg').textContent='백업 파일을 내려받았습니다.';
}

/* ══════════════ 5. 캘린더 ══════════════ */
const DOW=['일','월','화','수','목','금','토'];
function dstr(y,m,d){return y+'-'+pad(m+1)+'-'+pad(d);}
function todayStr(){const t=new Date();return dstr(t.getFullYear(),t.getMonth(),t.getDate());}
function fmtDay(s){const [y,m,d]=String(s||'').split('-').map(Number);if(!y)return '';return m+'월 '+d+'일 ('+DOW[new Date(y,m-1,d).getDay()]+')';}
function eventsOn(date){return S.events.filter(e=>e.date===date).sort((a,b)=>String(a.time||'').localeCompare(String(b.time||'')));}
function docsForPlatform(key){
  if(!key)return [];
  const Q=buildQuery(key);if(!Q)return [];
  return S.docs.map(d=>({d,...scoreDoc(d,Q)})).filter(r=>r.score>=55).sort((a,b)=>b.score-a.score).map(r=>r.d);
}
function evCheck(ev){const st=S.checks['e_'+ev.id];return (st&&st.items)||{};}
function evTasks(ev){
  const out=[];
  for(const id of (ev.docIds||[])){
    const d=S.docs.find(x=>x.id===id);if(!d)continue;
    const groups=[];
    (d.blocks||[]).forEach((b,bi)=>{
      if(b.kind!=='steps'&&b.kind!=='list'&&b.kind!=='warn')return;
      const items=(b.items||[]).map((text,ii)=>({text,key:id+'_'+bi+'_'+ii}));
      if(items.length)groups.push({heading:b.heading||'',items});
    });
    out.push({doc:d,groups});
  }
  return out;
}
function evStats(ev){
  const done=evCheck(ev);let total=0,n=0;
  for(const t of evTasks(ev))for(const g of t.groups)for(const it of g.items){total++;if(done[it.key])n++;}
  (ev.extra||[]).forEach((_,i)=>{total++;if(done['x_'+i])n++;});
  return {total,done:n};
}
function renderCal(){
  const {y,m}=S.cal;
  const start=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate(),prevLast=new Date(y,m,0).getDate();
  const today=todayStr(),sel=S.selDate,cells=[];
  for(let i=start-1;i>=0;i--)cells.push({d:prevLast-i,out:true,date:dstr(m===0?y-1:y,m===0?11:m-1,prevLast-i)});
  for(let d=1;d<=last;d++)cells.push({d,out:false,date:dstr(y,m,d)});
  while(cells.length%7){const n=cells.length-start-last+1;cells.push({d:n,out:true,date:dstr(m===11?y+1:y,m===11?0:m+1,n)});}
  const usedPf=[...new Set(S.events.map(e=>e.platform).filter(Boolean))];
  app.innerHTML=`
    <div class="calbar">
      <h2 class="calmonth">${y}년 ${m+1}월</h2>
      <button class="btn sm" id="prevM" aria-label="이전 달">◀</button>
      <button class="btn sm" id="nextM" aria-label="다음 달">▶</button>
      <button class="btn sm" id="todayB">오늘</button>
      <span style="flex:1"></span>
      <button class="btn primary" id="addEv">+ 일정 추가</button>
    </div>
    <div class="calgrid">
      <div class="dow">${DOW.map(d=>`<span>${d}</span>`).join('')}</div>
      <div class="days">${cells.map(c=>{
        const evs=eventsOn(c.date),show=evs.slice(0,3);
        return `<button class="day ${c.out?'out':''} ${c.date===today?'today':''}" data-day="${c.date}" aria-pressed="${sel===c.date}">
          <span class="dnum">${c.d}</span>
          ${show.map(e=>`<span class="evchip ${pf(e.platform).cls}">${esc((e.time?e.time+' ':'')+e.title)}</span>`).join('')}
          ${evs.length>show.length?`<span class="more">+${evs.length-show.length}</span>`:''}
        </button>`;}).join('')}</div>
    </div>
    ${usedPf.length?`<div class="legend">${usedPf.map(k=>`<span><i class="pfdot ${pf(k).cls}" style="background:currentColor"></i>${esc(k)}</span>`).join('')}</div>`:''}
    <div class="dayp">
      <p class="sectlabel">${sel?fmtDay(sel)+' 일정':'날짜를 누르면 그날 일정이 보입니다'}</p>
      ${sel?(eventsOn(sel).length?eventsOn(sel).map(e=>{
        const st=evStats(e);
        return `<button class="evrow" data-ev="${esc(e.id)}">
          <span class="tm">${esc(e.time||'—')}</span>
          <span><span class="ti">${esc(e.title)}</span><span class="pill ${pf(e.platform).cls}" style="margin-left:6px">${esc(e.platform||'공통')}</span></span>
          <span class="rt">${st.total?'할 일 '+st.done+'/'+st.total:'할 일 없음'}</span></button>`;}).join('')
        :`<div class="empty"><strong>이 날은 일정이 없습니다</strong>위 <b>+ 일정 추가</b>로 등록하세요.</div>`):''}
    </div>`;
  document.getElementById('prevM').onclick=()=>{S.cal=m===0?{y:y-1,m:11}:{y,m:m-1};render();};
  document.getElementById('nextM').onclick=()=>{S.cal=m===11?{y:y+1,m:0}:{y,m:m+1};render();};
  document.getElementById('todayB').onclick=()=>{const t=new Date();S.cal={y:t.getFullYear(),m:t.getMonth()};S.selDate=todayStr();render();};
  document.getElementById('addEv').onclick=()=>startEvent(null,S.selDate||todayStr());
  app.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{
    const dt=b.dataset.day,[yy,mm]=dt.split('-').map(Number);
    S.selDate=dt;if(mm-1!==S.cal.m)S.cal={y:yy,m:mm-1};render();
  });
  app.querySelectorAll('[data-ev]').forEach(b=>b.onclick=()=>openEvent(b.dataset.ev));
}
function openEvent(id){S.curEv=S.events.find(e=>e.id===id)||null;S.view=S.curEv?'event':'cal';S.evPendDel=null;window.scrollTo(0,0);render();}
function renderEvent(){
  const ev=S.curEv,done=evCheck(ev),st=evStats(ev),tasks=evTasks(ev);
  const linked=new Set(ev.docIds||[]);
  const sugg=docsForPlatform(ev.platform).filter(d=>!linked.has(d.id)).slice(0,6);
  app.innerHTML=`
    <div class="backrow">
      <button class="btn" id="back">← 캘린더</button>
      <button class="btn" id="edit">수정</button>
      <button class="btn danger" id="del">${S.evPendDel?'정말 삭제할까요?':'삭제'}</button>
    </div>
    <article class="doc">
      <div class="cardmeta">
        <span class="pill ${pf(ev.platform).cls}">${esc(ev.platform||'공통')}</span>
        <span class="pill">${esc(fmtDay(ev.date))}${ev.time?' '+esc(ev.time):''}</span>
      </div>
      <h1>${esc(ev.title)}</h1>
      ${ev.note?`<p class="lede">${esc(ev.note)}</p>`:''}
      ${st.total?`<div class="chkhead">
        <span class="pill prog">할 일 ${st.done}/${st.total}</span>
        <span class="progbar"><i style="width:${Math.round(st.done/st.total*100)}%"></i></span>
        ${st.done?'<button class="btn sm" id="resetEv">체크 초기화</button>':''}</div>`:''}
      ${(ev.extra||[]).length?`<div class="srcdoc"><div class="srchead"><b>이 일정에만 있는 항목</b></div>
        <ul class="chklist">${ev.extra.map((it,i)=>`<li><button class="chkrow" data-evchk="x_${i}" aria-pressed="${!!done['x_'+i]}"><span class="chkbox">✓</span><span class="chktext">${esc(it)}</span></button></li>`).join('')}</ul></div>`:''}
      ${tasks.length?tasks.map(t=>`<div class="srcdoc">
        <div class="srchead"><span class="pill ${esc(t.doc.type)}">${esc((TYPES[t.doc.type]||{ko:''}).ko)}</span><b>${esc(t.doc.title)}</b>
          <button class="btn sm" data-godoc="${esc(t.doc.id)}">문서 열기</button></div>
        ${t.groups.length?t.groups.map(g=>`
          ${g.heading?`<div class="srchead" style="background:transparent;color:var(--ink-3);font-family:var(--mono);font-size:11px;letter-spacing:.06em">${esc(g.heading)}</div>`:''}
          <ul class="chklist">${g.items.map(it=>`<li><button class="chkrow" data-evchk="${esc(it.key)}" aria-pressed="${!!done[it.key]}"><span class="chkbox">✓</span><span class="chktext">${esc(it.text)}</span></button></li>`).join('')}</ul>`).join('')
        :`<p class="bhelp" style="padding:11px 13px">이 문서에는 체크할 항목이 없습니다.</p>`}</div>`).join('')
      :`<div class="empty" style="margin-top:14px"><strong>연결된 문서가 없습니다</strong>아래에서 이 플랫폼 관련 문서를 붙이면 해야 할 일이 체크리스트로 나옵니다.</div>`}
      ${sugg.length?`<p class="sectlabel" style="margin-top:22px">이 플랫폼 관련 문서 — 눌러서 이 일정에 붙이기</p>
        <div class="suggest">${sugg.map(d=>`<button data-link="${esc(d.id)}">+ ${esc(d.title)}</button>`).join('')}</div>`:''}
    </article>`;
  document.getElementById('back').onclick=()=>{S.view='cal';S.curEv=null;render();};
  document.getElementById('edit').onclick=()=>startEvent(ev,ev.date);
  app.querySelectorAll('[data-evchk]').forEach(b=>b.onclick=()=>toggleEvCheck(ev,b.dataset.evchk));
  app.querySelectorAll('[data-godoc]').forEach(b=>b.onclick=()=>openDoc(b.dataset.godoc));
  app.querySelectorAll('[data-link]').forEach(b=>b.onclick=()=>linkDoc(ev,b.dataset.link));
  const r=document.getElementById('resetEv');
  if(r)r.onclick=async()=>{S.checks['e_'+ev.id]={period:'EVENT',items:{}};render();
    await sb.from('checks').upsert({id:'e_'+ev.id,period:'EVENT',items:{},updated_at:new Date().toISOString()});};
  document.getElementById('del').onclick=async()=>{
    if(!S.evPendDel){S.evPendDel=true;render();setTimeout(()=>{if(S.evPendDel){S.evPendDel=null;if(S.view==='event')render();}},4000);return;}
    S.evPendDel=null;
    await sb.from('events').delete().eq('id',ev.id);
    S.view='cal';S.curEv=null;await loadAll();
  };
}
async function toggleEvCheck(ev,key){
  const items=Object.assign({},evCheck(ev));
  if(items[key])delete items[key];else items[key]=true;
  S.checks['e_'+ev.id]={period:'EVENT',items};render();
  await sb.from('checks').upsert({id:'e_'+ev.id,period:'EVENT',items,updated_at:new Date().toISOString()});
}
async function linkDoc(ev,docId){
  const ids=[...new Set((ev.docIds||[]).concat([docId]))];
  ev.docIds=ids;render();
  await sb.from('events').update({doc_ids:ids,updated_at:new Date().toISOString()}).eq('id',ev.id);
}
function startEvent(ev,date){
  S.evEditing=ev||null;
  S.evDraft=ev?JSON.parse(JSON.stringify(ev)):{id:uid(),date:date||todayStr(),time:'',title:'',platform:'카쇼라',docIds:[],extra:[],note:'',author:S.me};
  S.view='evedit';S.msg=null;window.scrollTo(0,0);render();
}
function renderEvEdit(){
  const v=S.evDraft;
  const matched=docsForPlatform(v.platform).map(d=>d.id);
  const ordered=S.docs.slice().sort((a,b)=>(matched.indexOf(b.id)>-1)-(matched.indexOf(a.id)>-1));
  app.innerHTML=`
    <div class="backrow"><button class="btn" id="cancel">← 취소</button></div>
    <div class="composer">
      <h2>${S.evEditing?'일정 수정':'새 일정'}</h2>
      <p class="sub">플랫폼을 고르면 그 플랫폼 문서가 위로 올라옵니다. 연결한 문서의 절차가 이 일정의 체크리스트가 됩니다.</p>
      <div class="two">
        <div class="editfield"><label>날짜</label><input type="date" id="e_date" value="${esc(v.date)}"></div>
        <div class="editfield"><label>시간 (선택)</label><input type="time" id="e_time" value="${esc(v.time||'')}"></div>
      </div>
      <div class="editfield"><label>일정 이름</label><input id="e_title" value="${esc(v.title)}" placeholder="예) 카쇼라 라이브 — 허브 기획전"></div>
      <div class="editfield"><label>플랫폼</label><select id="e_pf">${PLATFORMS.map(p=>`<option value="${esc(p.key)}" ${v.platform===p.key?'selected':''}>${esc(p.label)}</option>`).join('')}</select></div>
      <div class="editfield"><label>메모 (선택)</label><input id="e_note" value="${esc(v.note||'')}"></div>
      <p class="sectlabel" style="margin-top:22px">연결할 문서 ${matched.length?`· ${esc(v.platform)} 관련 ${matched.length}건을 위에 띄웠습니다`:''}</p>
      <div>${ordered.length?ordered.map(d=>`<label class="pickrow"><input type="checkbox" data-ed="${esc(d.id)}" ${(v.docIds||[]).includes(d.id)?'checked':''}>
        <span><b>${esc(d.title)}</b><span>${esc((TYPES[d.type]||{ko:''}).ko)} · ${esc(d.summary||'')}</span>
        ${matched.includes(d.id)?`<span style="font-size:12px;color:var(--sea)">${esc(v.platform)} 관련</span>`:''}</span></label>`).join('')
        :'<p class="bhelp">아직 문서가 없습니다.</p>'}</div>
      <div class="editfield"><label>이 일정에만 추가할 항목 (한 줄에 하나씩)</label>
        <textarea id="e_extra" rows="3" placeholder="예) 진행자 리허설 30분 전 도착 확인">${esc((v.extra||[]).join('\n'))}</textarea></div>
      <div id="msg">${S.msg?`<div class="notice ${esc(S.msg.k||'')}">${esc(S.msg.t)}</div>`:''}</div>
      <div class="row"><button class="btn primary" id="saveEv">${S.evEditing?'수정 내용 저장':'일정 저장'}</button><span class="thinking" id="savemsg"></span></div>
    </div>`;
  document.getElementById('cancel').onclick=()=>{S.view=S.evEditing?'event':'cal';S.curEv=S.evEditing;S.evEditing=null;S.evDraft=null;S.msg=null;render();};
  document.getElementById('e_pf').onchange=()=>{const keep=S.evDraft.id;S.evDraft=Object.assign({id:keep},readEvEditor());render();};
  document.getElementById('saveEv').onclick=saveEvent;
}
function readEvEditor(){
  const g=id=>{const e=document.getElementById(id);return e?e.value:'';};
  const ids=[];app.querySelectorAll('[data-ed]').forEach(cb=>{if(cb.checked)ids.push(cb.dataset.ed);});
  return {date:g('e_date'),time:g('e_time'),title:g('e_title'),platform:g('e_pf'),note:g('e_note'),
    docIds:ids,extra:g('e_extra').split('\n').map(x=>x.trim()).filter(Boolean),author:S.me};
}
async function saveEvent(){
  const v=Object.assign({id:S.evDraft.id},readEvEditor());
  if(!v.date){setMsg('날짜를 정해주세요.','err');return;}
  if(!v.title.trim()){setMsg('일정 이름을 적어주세요.','err');return;}
  const msg=document.getElementById('savemsg');if(msg)msg.textContent='저장 중…';
  const {error}=await sb.from('events').upsert(evRow(v));
  if(error){if(msg)msg.textContent='';setMsg('저장하지 못했습니다: '+error.message,'err');return;}
  const [yy,mm]=v.date.split('-').map(Number);
  S.cal={y:yy,m:mm-1};S.selDate=v.date;
  S.evEditing=null;S.evDraft=null;S.msg=null;S.view='cal';S.curEv=null;
  await loadAll();
}

const SUPABASE_KEY = "eyJhbGciOi...";</pre>

document.getElementById('newBtn').onclick=()=>startCompose(null);
